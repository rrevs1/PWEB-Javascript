
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style3.css">
    <script src="java3.js" defer></script>
</head>
<body>
    <div class="container">
        <h2>REGISTRATION FORM</h2>
        <div class="form-box">
            <form id="registrationForm" novalidate>
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" placeholder="Enter your full name">
                    <span class="error" id="name-error"></span>
                </div>
                <div class="form-group">
                    <label for="address">Address:</label>
                    <input type="text" id="address" placeholder="Enter your address">
                    <span class="error" id="address-error"></span>
                </div>
                <div class="form-group">
                    <label for="email">E-mail Address:</label>
                    <input type="email" id="email" placeholder="Enter your email">
                    <span class="error" id="email-error"></span>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password">
                    <span class="error" id="password-error"></span>
                </div>
                <div class="form-group">
                    <label for="course">Select Your Course:</label>
                    <select id="course">
                        <option value="">Select Course</option>
                        <option value="Informatics">Informatics</option>
                        <option value="Information Systems">Information Systems</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Management">Management</option>
                    </select>
                    <span class="error" id="course-error"></span>
                </div>
                <div class="form-group">
                    <label for="college">College Name:</label>
                    <textarea id="college"></textarea>
                    <span class="error" id="college-error"></span>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="agreement">
                    <label for="agreement">I agree to the above information</label>
                </div>
                <span class="error" id="agreement-error"></span>
                <div class="buttons">
                    <button type="submit">Send</button>
                    <button type="reset">Reset</button>
                </div>
                <div class="success" id="success-message">
                    Registration submitted successfully!
                </div>
            </form>
        </div>
    </div>
</body>
</html>
